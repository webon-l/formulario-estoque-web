<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Formulário de Estoque</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    form { background: #fff; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    textarea, input, select, button { width: 100%; margin-top: 10px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
    button { background-color: #444; color: white; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <form id="estoque-form">
    <h2>Registro de Saída ou Perda</h2>

    <label for="tipo">Tipo:</label>
    <select id="tipo" name="tipo" onchange="mostrarMotivo(this.value)">
      <option value="Saída">Saída</option>
      <option value="Perda">Perda</option>
    </select>

    <label for="produtos">Produtos (um por linha):</label>
    <textarea id="produtos" name="produtos" rows="6" required></textarea>

    <label for="responsavel">Responsável:</label>
    <input type="text" id="responsavel" name="responsavel" required>

    <div id="motivo-div" style="display:none;">
      <label for="motivo">Motivo da perda:</label>
      <input type="text" id="motivo" name="motivo">
    </div>

    <button type="submit">Enviar</button>
    <p id="mensagem" style="text-align:center; margin-top:10px;"></p>
  </form>

  <script>
    function mostrarMotivo(valor) {
      document.getElementById("motivo-div").style.display = valor === "Perda" ? "block" : "none";
    }

    document.getElementById("estoque-form").addEventListener("submit", async function(e) {
      e.preventDefault();

      const tipo = document.getElementById("tipo").value;
      const produtos = document.getElementById("produtos").value;
      const responsavel = document.getElementById("responsavel").value;
      const motivo = document.getElementById("motivo").value;

      const dados = { tipo, produtos, responsavel, motivo: tipo === "Perda" ? motivo : null };

      try {
        const resposta = await fetch("https://servidor-estoque.onrender.com/enviar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dados)
        });

        const resultado = await resposta.json();
        const msg = document.getElementById("mensagem");

        if (resposta.ok) {
          msg.style.color = "green";
          msg.textContent = "Enviado com sucesso!";
          document.getElementById("estoque-form").reset();
          mostrarMotivo("Saída");
        } else {
          msg.style.color = "red";
          msg.textContent = "Erro ao enviar: " + resultado.mensagem;
        }
      } catch (err) {
        document.getElementById("mensagem").style.color = "red";
        document.getElementById("mensagem").textContent = "Erro de conexão com o servidor.";
      }
    });
  </script>
</body>
</html>
